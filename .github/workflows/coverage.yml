name: Coverage

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CTEST_OUTPUT_ON_FAILURE: ON

jobs:
  Linux:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 2
      CTEST_PARALLEL_LEVEL: 4
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04]
        threading: [TBB]
        include:
          - os: ubuntu-22.04
            name: Linux
    steps:
      - name: Free disk space
        run: |
          echo "Before cleanup:"
          df -h

          # Remove big toolchains we don't need
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/lib/android

          # Clean apt caches
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*

          echo "After cleanup:"
          df -h


      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 10

      - name: Set up Python test dependencies
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Python test dependencies
        run: python -m pip install -r tests/python-requirements.txt

      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get -o Acquire::Retries=3 install \
          libblas-dev \
          libglu1-mesa-dev \
          xorg-dev \
          ccache \
          ninja-build \
          lcov
          echo 'CACHE_PATH=~/.cache/ccache' >> "$GITHUB_ENV"

      - name: Restore compiler cache
        id: cache-build
        uses: actions/cache/restore@v5
        with:
          path: ${{ env.CACHE_PATH }}
          key: ${{ runner.os }}-${{ runner.arch }}-cov-portable-v1-${{ matrix.threading }}-cache-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-cov-portable-v1-${{ matrix.threading }}-cache-

      - name: Prepare ccache
        run: |
          # ccache --max-size=1.0G
          ccache -V && ccache --show-stats && ccache --zero-stats

      - name: Configure
        run: |
          cmake -G Ninja -S . -B build \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_CXX_FLAGS_DEBUGNOSYMBOLS="" \
            -DPOLYFEM_CODE_COVERAGE=ON \
            -DPOLYFEM_PORTABLE_BUILD=ON \
            -DPOLYSOLVE_WITH_CHOLMOD=OFF \
            -DPOLYSOLVE_WITH_AMGCL=OFF \
            -DPOLYFEM_THREADING=${{ matrix.threading }}

      - name: Build
        id: build
        run: cmake --build build && ccache --show-stats

      - name: Save compiler cache
        if: >-
          ${{ !cancelled()
              && (steps.build.outcome == 'success' || steps.build.outcome == 'failure')
              && steps.cache-build.outputs.cache-primary-key != ''
              && steps.cache-build.outputs.cache-hit != 'true' }}
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          path: ${{ env.CACHE_PATH }}
          key: ${{ steps.cache-build.outputs.cache-primary-key }}

      - name: Run Tests
        env:
          OMP_NUM_THREADS: "1"
        run: ctest --test-dir build --timeout 3000 --output-on-failure

      - name: Create Coverage
        run: |
          cd build
          lcov --directory . --capture --output-file coverage.info
          lcov --remove coverage.info '/usr/*' "${HOME}"'/.cache/*' '*tests/*.cpp*' '*/polyfem/problem/*.cpp*' '*/polyfem/problem/*.hpp*' --output-file coverage.info

      - name: Upload Coverage
        uses: codecov/codecov-action@v6
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
            flags: polyfem # optional
            files: coverage.info
            name: polyfem # optional
            fail_ci_if_error: false # optional (default = false)
            verbose: true # optional (default = false)
