name: Coverage

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CTEST_OUTPUT_ON_FAILURE: ON

jobs:
  Linux:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 2
      CTEST_PARALLEL_LEVEL: 4
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04]
        threading: [TBB]
        include:
          - os: ubuntu-22.04
            name: Linux
    steps:
      - name: Free disk space
        run: |
          echo "Before cleanup:"
          df -h

          # Remove big toolchains we don't need
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/lib/android

          # Clean apt caches
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*

          echo "After cleanup:"
          df -h


      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 10

      - name: Set up Python test dependencies
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Python test dependencies
        run: python -m pip install -r tests/python-requirements.txt

      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get -o Acquire::Retries=3 install \
          libblas-dev \
          libglu1-mesa-dev \
          xorg-dev \
          ccache \
          ninja-build \
          lcov
          echo 'CACHE_PATH=~/.cache/ccache' >> "$GITHUB_ENV"

      - name: Compute CPU cache key
        run: |
          mkdir -p coverage-diagnostics
          lscpu | tee coverage-diagnostics/cpu.txt
          cat /proc/cpuinfo > coverage-diagnostics/cpuinfo.txt
          g++ -march=native -Q --help=target > coverage-diagnostics/compiler-native-target.txt
          # A feature hash does not identify the CPU model or a runner CPU quota.
          for resource in /sys/fs/cgroup/cpu.max /sys/fs/cgroup/cpu.stat /sys/fs/cgroup/cpu/cpu.cfs_quota_us /sys/fs/cgroup/cpu/cpu.cfs_period_us; do
            if [ -r "$resource" ]; then
              echo "$resource"
              cat "$resource"
            fi
          done | tee coverage-diagnostics/cpu-quota.txt
          # A dependency builds with -march=native, which bakes CPU-specific
          # instructions (e.g. AVX-512) into the object files. ccache hashes the
          # literal "-march=native" flag, not the resolved instruction set, so it
          # will happily reuse objects across different CPUs. GitHub's runner pool
          # is heterogeneous (some hosts have AVX-512, some don't), so a cache built
          # on a wider CPU gets replayed onto a narrower one -> SIGILL at runtime.
          # Fold the CPU feature flags into the cache key so objects are only ever
          # restored onto a compatible microarchitecture.
          CPU_HASH=$(grep -m1 '^flags' /proc/cpuinfo | md5sum | cut -d' ' -f1)
          echo "CPU_HASH=$CPU_HASH" >> "$GITHUB_ENV"
          echo "CPU flags hash: $CPU_HASH"

      - name: Restore compiler cache
        id: cache-build
        uses: actions/cache/restore@v5
        with:
          path: ${{ env.CACHE_PATH }}
          key: ${{ runner.os }}-cov-${{ matrix.threading }}-cpu-${{ env.CPU_HASH }}-cache-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ${{ runner.os }}-cov-${{ matrix.threading }}-cpu-${{ env.CPU_HASH }}-cache

      - name: Prepare ccache
        run: |
          # ccache --max-size=1.0G
          ccache -V && ccache --show-stats && ccache --zero-stats

      - name: Configure
        run: |
          cmake -G Ninja -S . -B build \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DCMAKE_CXX_FLAGS_DEBUGNOSYMBOLS="" \
            -DPOLYFEM_CODE_COVERAGE=ON \
            -DPOLYSOLVE_WITH_CHOLMOD=OFF \
            -DPOLYSOLVE_WITH_AMGCL=OFF \
            -DPOLYFEM_THREADING=${{ matrix.threading }}

          cp build/CMakeCache.txt build/compile_commands.json coverage-diagnostics/

      - name: Build
        id: build
        shell: bash
        run: |
          report_resources() {
            date -u '+Resource usage at %Y-%m-%dT%H:%M:%SZ'
            free -h
            df -h .
          }

          # Keep resource readings in the log even if the runner is terminated.
          (
            trap 'exit 0' TERM
            trap 'kill "${monitor_sleep_pid:-}" 2>/dev/null || true' EXIT
            while true; do
              report_resources
              sleep 30 &
              monitor_sleep_pid=$!
              wait "$monitor_sleep_pid"
            done
          ) &
          monitor_pid=$!
          trap 'kill "$monitor_pid" 2>/dev/null || true; wait "$monitor_pid" 2>/dev/null || true' EXIT

          cmake --build build
          ccache --show-stats

      - name: Save compiler cache
        if: >-
          ${{ !cancelled()
              && (steps.build.outcome == 'success' || steps.build.outcome == 'failure')
              && steps.cache-build.outputs.cache-primary-key != ''
              && steps.cache-build.outputs.cache-hit != 'true' }}
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          path: ${{ env.CACHE_PATH }}
          key: ${{ steps.cache-build.outputs.cache-primary-key }}

      - name: Run Tests
        shell: bash
        run: |
          # These quadrature fixtures were unchanged by the data updates.
          # Compare serial and suite timings to distinguish CPU/code generation
          # costs from parallel contention.
          OMP_NUM_THREADS=1 /usr/bin/time -v -o coverage-diagnostics/serial-time.txt \
            ctest --test-dir build -j 1 --timeout 3000 --output-on-failure \
              -R '^auto_quadrature tensor product$' \
              --output-log "$PWD/coverage-diagnostics/serial-test.log"

          (
            trap 'exit 0' TERM
            trap 'kill "${monitor_sleep_pid:-}" 2>/dev/null || true' EXIT
            while true; do
              date -u '+Test resource usage at %Y-%m-%dT%H:%M:%SZ'
              free -h
              df -h .
              # Show the largest resident processes to identify memory-heavy tests.
              ps -eo pid,nlwp,pcpu,pmem,rss,args --sort=-rss | sed -n '1,9p'
              sleep 30 &
              monitor_sleep_pid=$!
              wait "$monitor_sleep_pid"
            done
          ) &
          monitor_pid=$!

          # CPU, I/O wait, and swap activity; the first sample is since boot,
          # subsequent samples cover each 30-second interval.
          vmstat -w 30 &
          vmstat_pid=$!
          trap 'kill "$monitor_pid" "$vmstat_pid" 2>/dev/null || true; wait "$monitor_pid" "$vmstat_pid" 2>/dev/null || true' EXIT

          OMP_NUM_THREADS=1 /usr/bin/time -v -o coverage-diagnostics/suite-time.txt \
            ctest --test-dir build --timeout 3000 --output-on-failure \
              --output-log "$PWD/coverage-diagnostics/tests.log" \
              --output-junit "$PWD/coverage-diagnostics/tests.xml"

      - name: Collect final CPU diagnostics
        if: ${{ !cancelled() }}
        run: |
          mkdir -p coverage-diagnostics
          if [ -r /sys/fs/cgroup/cpu.stat ]; then
            cat /sys/fs/cgroup/cpu.stat | tee coverage-diagnostics/cpu-stat-final.txt
          fi
          if [ -f build/tests/unit_tests ]; then
            ldd build/tests/unit_tests | tee coverage-diagnostics/test-libraries.txt
          fi

      - name: Save coverage diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-diagnostics-${{ github.run_attempt }}
          path: |
            coverage-diagnostics/
            build/Testing/Temporary/LastTest.log
            build/Testing/Temporary/LastTestsFailed.log
          retention-days: 14

      - name: Create Coverage
        run: |
          cd build
          lcov --directory . --capture --output-file coverage.info
          lcov --remove coverage.info '/usr/*' "${HOME}"'/.cache/*' '*tests/*.cpp*' '*/polyfem/problem/*.cpp*' '*/polyfem/problem/*.hpp*' '*/polyfem/legacy/*' --output-file coverage.info

      - name: Upload Coverage
        uses: codecov/codecov-action@v6
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
            flags: polyfem # optional
            files: coverage.info
            name: polyfem # optional
            fail_ci_if_error: false # optional (default = false)
            verbose: true # optional (default = false)
